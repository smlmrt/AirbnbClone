<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AirbnbClone hesabınıza giriş yapın.">
    <title>Giriş Yap — AirbnbClone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2 onclick="window.location.href='index.html'">🏠 AirbnbClone</h2>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Giriş Yap</h2>
            <form id="loginForm">
                <input type="email"    id="loginEmail"    class="form-input" placeholder="E-posta" required>
                <input type="password" id="loginPassword" class="form-input" placeholder="Şifre"   required>
                <button type="submit" class="submit-btn">Giriş</button>
            </form>
            <p class="auth-link">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>

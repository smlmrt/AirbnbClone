<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- DÜZELTME: initial-width → initial-scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yayınladığınız ev ilanlarını yönetin.">
    <title>İlanlarım — AirbnbClone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🏠 AirbnbClone</a>
        <button class="btn-back" onclick="window.location.href='index.html'">← Ana Sayfa</button>
    </header>

    <div class="inner-container">
        <h1 class="page-title">İlanlarım</h1>
        <div id="listingsContainer" class="cards-grid">
            <p class="empty-state">Yükleniyor...</p>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5019/api/listings";

        async function fetchMyListings() {
            const token = localStorage.getItem("token");
            if (!token) return window.location.href = "index.html";

            try {
                const res = await fetch(`${API_URL}/my-listings`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const listings = await res.json();
                    const container = document.getElementById("listingsContainer");

                    if (listings.length === 0) {
                        container.innerHTML =
                            "<p class='empty-state'>Sisteme kayıtlı herhangi bir ilanınız bulunmuyor.</p>";
                        return;
                    }

                    container.innerHTML = listings.map(l => `
                        <div class="item-card">
                            <img src="${l.imageUrl || 'https://via.placeholder.com/400x200?text=Görsel+Yok'}"
                                 alt="${l.title}">
                            <div class="item-card-content">
                                <h3>${l.title}</h3>
                                <p class="item-card-location">📍 ${l.city}</p>
                                <p class="item-card-price">${l.pricePerNight} ₺ / gece</p>
                                <button onclick="deleteMyListing(${l.id})" class="btn-delete-card">
                                    İlanı Sil
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error("Hata:", error);
            }
        }

        async function deleteMyListing(id) {
            if (!confirm("İlanı silmek istediğinize emin misiniz?")) return;
            const token = localStorage.getItem("token");

            const res = await fetch(`${API_URL}/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.ok) fetchMyListings();
            else alert("İlan silinirken hata oluştu.");
        }

        document.addEventListener("DOMContentLoaded", fetchMyListings);
    </script>
</body>
</html>

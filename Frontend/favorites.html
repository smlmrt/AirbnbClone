<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- DÜZELTME: initial-width → initial-scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Favorilere eklediğiniz ev ilanlarını görüntüleyin.">
    <title>Favorilerim — AirbnbClone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🏠 AirbnbClone</a>
        <button class="btn-back" onclick="window.location.href='index.html'">← Ana Sayfa</button>
    </header>

    <div class="inner-container">
        <h1 class="page-title">Favorilerim</h1>
        <div id="favoritesContainer" class="cards-grid">
            <p class="empty-state">Yükleniyor...</p>
        </div>
    </div>

    <script>
        async function fetchFavorites() {
            const token = localStorage.getItem("token");
            if (!token) return window.location.href = "index.html";

            try {
                const res = await fetch("http://localhost:5019/api/favorites", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const listings = await res.json();
                    const container = document.getElementById("favoritesContainer");

                    if (listings.length === 0) {
                        container.innerHTML =
                            "<p class='empty-state'>Henüz favorilere eklediğiniz bir ilan bulunmuyor.</p>";
                        return;
                    }

                    container.innerHTML = listings.map(l => `
                        <div class="item-card"
                             style="cursor:pointer;"
                             onclick="window.location.href='detail.html?id=${l.id}'">
                            <img src="${l.imageUrl || 'https://via.placeholder.com/400x200?text=Görsel+Yok'}"
                                 alt="${l.title}">
                            <div class="item-card-content">
                                <h3>${l.title}</h3>
                                <p class="item-card-location">📍 ${l.city}</p>
                                <p class="item-card-price">${l.pricePerNight} ₺ / gece</p>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error("Hata:", error);
            }
        }

        document.addEventListener("DOMContentLoaded", fetchFavorites);
    </script>
</body>
</html>

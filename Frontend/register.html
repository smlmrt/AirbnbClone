<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AirbnbClone'a ücretsiz kayıt olun.">
    <title>Kayıt Ol — AirbnbClone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2 onclick="window.location.href='index.html'">🏠 AirbnbClone</h2>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Kayıt Ol</h2>
            <form id="registerForm">
                <input type="text"     id="regFirstName" class="form-input" placeholder="Ad"      required>
                <input type="text"     id="regLastName"  class="form-input" placeholder="Soyad"   required>
                <input type="email"    id="regEmail"     class="form-input" placeholder="E-posta" required>
                <input type="password" id="regPassword"  class="form-input" placeholder="Şifre"   required>
                <button type="submit" class="submit-btn">Hesap Oluştur</button>
            </form>
            <p class="auth-link">Zaten hesabın var mı? <a href="login.html">Giriş Yap</a></p>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>

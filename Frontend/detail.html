<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>İlan Detayı - Airbnb Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fff; color: #222; }
        .navbar { display: flex; justify-content: space-between; padding: 20px 40px; background: white; border-bottom: 1px solid #ebebeb; }
        .logo { color: #ff5a5f; font-size: 24px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .submit-btn { background-color: #ff5a5f; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        .submit-btn:hover { background-color: #e0484d; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🏠 AirbnbClone</a>
        <div>
            <button onclick="window.location.href='index.html'" style="padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-weight: bold;">Ana Sayfa</button>
        </div>
    </header>

    <!-- detail.js içerisindeki tüm dinamik tasarım bu div'in içine enjekte edilecek -->
    <div class="container" id="detailContainer">
        <p style="text-align: center; font-size: 18px; color: #717171; margin-top: 50px;">İlan detayları yükleniyor...</p>
    </div>

    <!-- JavaScript dosyasını sayfaya bağlıyoruz -->
    <script src="detail.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- DÜZELTME: initial-width → initial-scale -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geçmiş ve aktif seyahatlerinizi görüntüleyin.">
    <title>Seyahatlerim — AirbnbClone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🏠 AirbnbClone</a>
        <button class="btn-back" onclick="window.location.href='index.html'">← Ana Sayfa</button>
    </header>

    <div class="inner-container">
        <h1 class="page-title">Seyahatlerim</h1>
        <div id="tripsContainer" class="cards-grid">
            <p class="empty-state">Seyahatleriniz yükleniyor...</p>
        </div>
    </div>

    <script>
        async function fetchMyTrips() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch("http://localhost:5019/api/bookings/my-trips", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const trips = await res.json();
                    const container = document.getElementById("tripsContainer");

                    if (trips.length === 0) {
                        container.innerHTML =
                            "<p class='empty-state'>Henüz bir seyahatiniz bulunmuyor. Keşfetmeye başlayın!</p>";
                        return;
                    }

                    container.innerHTML = trips.map(t => {
                        const start = new Date(t.startDate).toLocaleDateString('tr-TR');
                        const end   = new Date(t.endDate).toLocaleDateString('tr-TR');
                        const img   = t.imageUrl || 'https://via.placeholder.com/400x200?text=Görsel+Yok';

                        return `
                            <div class="item-card">
                                <img src="${img}" alt="${t.listingTitle}">
                                <div class="item-card-content">
                                    <h3>${t.listingTitle}</h3>
                                    <p class="item-card-location">📍 ${t.city}</p>
                                    <p class="item-card-dates">🗓️ ${start} → ${end}</p>
                                    <hr class="item-card-divider">
                                    <p class="item-card-total">Toplam: ${t.totalPrice} ₺</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error("Seyahatler yüklenirken hata:", error);
                document.getElementById("tripsContainer").innerHTML =
                    "<p class='empty-state'>Sistemsel bir hata oluştu.</p>";
            }
        }

        document.addEventListener("DOMContentLoaded", fetchMyTrips);
    </script>
</body>
</html>

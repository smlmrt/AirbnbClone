<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlikler - AirbnbClone</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🏠 AirbnbClone</a>
        </div>

        <nav class="nav-tabs">
            <button class="nav-tab" onclick="window.location.href='index.html'">Konaklama</button>
            <button class="nav-tab active" onclick="window.location.href='experiences.html'">Etkinlikler</button>
        </nav>

        <div class="nav-right">
            <button id="addListingBtn" class="nav-btn nav-btn-outline" style="display:none;" onclick="window.location.href='index.html'">Evini Kiraya Ver</button>

            <button id="loginBtn" class="nav-btn" onclick="window.location.href='login.html'">Giriş Yap</button>
            <button id="registerBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='register.html'">Kayıt Ol</button>

            <div class="nav-menu" id="navMenu" style="display:none;">
                <button class="nav-menu-trigger" id="navMenuTrigger" aria-haspopup="true" aria-expanded="false">
                    <span class="nav-menu-icon">☰</span>
                    <span class="nav-menu-avatar">👤</span>
                </button>
                <div class="nav-menu-dropdown" id="navMenuDropdown">
                    <div class="nav-menu-greeting" id="userNameDisplay"></div>
                    <button class="nav-menu-item" id="myListingsBtn" onclick="window.location.href='my-listings.html'">İlanlarım</button>
                    <button class="nav-menu-item" id="myExperiencesBtn" onclick="window.location.href='my-experiences.html'">Etkinliklerim</button>
                    <button class="nav-menu-item" id="myTripsBtn" onclick="window.location.href='my-trips.html'">Seyahatlerim</button>
                    <button class="nav-menu-item" id="favoritesBtn" onclick="window.location.href='favorites.html'">Favorilerim</button>
                    <button class="nav-menu-item" id="profileBtn" onclick="window.location.href='profile.html'">Profil</button>
                    <button class="nav-menu-item" id="adminPanelBtn" onclick="window.location.href='admin.html'">Admin Paneli</button>
                    <hr class="nav-menu-divider">
                    <button class="nav-menu-item nav-menu-item-danger" id="logoutBtn">Çıkış Yap</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="container">
        <div class="page-header-row">
            <div>
                <h2 class="section-title">Unutulmaz Yerel Deneyimler</h2>
                <p style="color: #717171; margin-bottom: 20px;">Yerel rehberlerin düzenlediği etkinlikleri keşfedin ve tatilinizi renklendirin.</p>
            </div>
            <button id="addExperienceBtn" class="nav-btn nav-btn-outline" style="display:none;">Etkinlik Ekle</button>
        </div>

        <div class="listings-grid" id="experiencesGrid">
            <p>Etkinlikler yükleniyor...</p>
        </div>
    </main>

    <!-- Etkinlik Ekleme Modalı (Gizli) -->
    <div id="addExperienceModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Yeni Etkinlik Ekle</h2>
            <form id="addExperienceForm">
                <input type="text" id="expTitle" class="form-input" placeholder="Etkinlik Adı (Örn: Boğazda Tekne Turu)" required>
                <textarea id="expDescription" class="form-input" placeholder="Etkinliğin detaylarını anlatın..." required></textarea>
                
                <div class="form-row">
                    <input type="text" id="expLocation" class="form-input" placeholder="Konum (Şehir/Bölge)" required>
                    <input type="number" id="expPrice" class="form-input" placeholder="Kişi Başı Fiyat (₺)" required>
                </div>

                <div class="form-row">
                    <input type="number" id="expDuration" class="form-input" placeholder="Süre (Saat)" required min="1">
                    <input type="number" id="expMaxGroup" class="form-input" placeholder="Maks. Katılımcı" required min="1">
                </div>

                <input type="file" id="expImage" accept="image/*" class="form-input">
                <button type="submit" class="submit-btn">Etkinliği Yayınla</button>
            </form>
        </div>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/experiences.js"></script>
</body>
</html>

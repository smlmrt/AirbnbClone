<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AirbnbClone Yönetici Kontrol Paneli">
    <title>Admin Paneli — AirbnbClone</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🏠 AirbnbClone</a>
        </div>
        <div class="nav-links">
            <span id="userNameDisplay" class="nav-greeting" style="display:none;"></span>
            
            <button id="addListingBtn" class="nav-btn" style="display:none;" onclick="window.location.href='index.html'">Evini Kiraya Ver</button>
            <button id="favoritesBtn" class="nav-btn" onclick="window.location.href='favorites.html'" style="display:none;">Favorilerim</button>
            <button id="myListingsBtn" class="nav-btn" onclick="window.location.href='my-listings.html'" style="display:none;">İlanlarım</button>
            <button id="myTripsBtn" class="nav-btn" onclick="window.location.href='my-trips.html'" style="display:none;">Seyahatlerim</button>
            
            <button id="profileBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='profile.html'" style="display:none; margin-left: 10px;">Profil</button>
            <button id="adminPanelBtn" class="nav-btn nav-btn-admin" onclick="window.location.href='admin.html'" style="display:none;">Admin Paneli</button>
            <button id="logoutBtn" class="nav-btn nav-btn-logout" style="display:none;">Çıkış Yap</button>
            
            <button id="loginBtn" class="nav-btn" onclick="window.location.href='login.html'">Giriş Yap</button>
            <button id="registerBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='register.html'">Kayıt Ol</button>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-menu">
            <div class="admin-menu-item active" id="tabUsers"    onclick="switchTab('users')">Kullanıcı Yönetimi</div>
            <div class="admin-menu-item"         id="tabListings" onclick="switchTab('listings')">İlan Yönetimi</div>
        </div>

        <div class="admin-content" id="panelContent">
            <!-- JavaScript ile veriler buraya basılacak -->
        </div>
    </div>

    <script src="../js/navbar.js"></script>
    <script>
        // ─── Yetki Kontrolü ───
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "index.html";

        const decoded = parseJwt(token);
        if (!decoded) {
            window.location.href = "index.html";
        } else {
            const role = decoded.role || decoded["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"];
            if (role !== "Admin") {
                alert("Bu sayfaya erişim yetkiniz yok!");
                window.location.href = "index.html";
            }
        }

        // ─── Sekme Değiştirme ───
        async function switchTab(tab) {
            document.getElementById("tabUsers").className    = "admin-menu-item" + (tab === 'users'    ? " active" : "");
            document.getElementById("tabListings").className = "admin-menu-item" + (tab === 'listings' ? " active" : "");

            const content = document.getElementById("panelContent");
            content.innerHTML = "<p>Veriler yükleniyor...</p>";

            try {
                const res = await fetch(`http://localhost:5019/api/admin/${tab}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    if (tab === 'users') renderUsers(data);
                    else renderListings(data);
                } else {
                    content.innerHTML = "<p style='color:var(--color-primary);'>Veriler alınırken yetki hatası oluştu.</p>";
                }
            } catch (error) {
                content.innerHTML = "<p class='empty-state'>Sunucuya bağlanılamadı.</p>";
            }
        }

        // ─── Kullanıcı Tablosu ───
        function renderUsers(users) {
            let html = `<h3>Sistemdeki Kullanıcılar (${users.length})</h3>
                <table class="admin-table">
                    <thead>
                        <tr><th>ID</th><th>Ad Soyad</th><th>Email</th><th>Yetki</th><th>İşlem</th></tr>
                    </thead>
                    <tbody>`;

            users.forEach(u => {
                html += `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.fullName}</td>
                        <td>${u.email}</td>
                        <td>${u.role}</td>
                        <td>${u.role === 'Admin'
                            ? '—'
                            : `<button class="admin-delete-btn" onclick="deleteData('users', ${u.id})">Sil</button>`
                        }</td>
                    </tr>`;
            });

            document.getElementById("panelContent").innerHTML = html + "</tbody></table>";
        }

        // ─── İlan Tablosu ───
        function renderListings(listings) {
            let html = `<h3>Sistemdeki İlanlar (${listings.length})</h3>
                <table class="admin-table">
                    <thead>
                        <tr><th>ID</th><th>Başlık</th><th>Şehir</th><th>Fiyat</th><th>İşlem</th></tr>
                    </thead>
                    <tbody>`;

            listings.forEach(l => {
                html += `
                    <tr>
                        <td>${l.id}</td>
                        <td>${l.title}</td>
                        <td>${l.city}</td>
                        <td>${l.pricePerNight} ₺</td>
                        <td><button class="admin-delete-btn" onclick="deleteData('listings', ${l.id})">Sil</button></td>
                    </tr>`;
            });

            document.getElementById("panelContent").innerHTML = html + "</tbody></table>";
        }

        // ─── Kayıt Silme ───
        async function deleteData(type, id) {
            if (!confirm("Bu kaydı silmek istediğinize emin misiniz?")) return;

            const res = await fetch(`http://localhost:5019/api/admin/${type}/${id}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.ok) {
                alert("Kayıt başarıyla silindi.");
                switchTab(type);
            } else {
                const err = await res.text();
                alert(`Silme başarısız: ${err}`);
            }
        }

        // Sayfa ilk açıldığında kullanıcılar sekmesini yükle
        document.addEventListener("DOMContentLoaded", () => switchTab('users'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="İlan detaylarını inceleyin ve rezervasyon yapın.">
    <title>İlan Detayı — AirbnbClone</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🏠 AirbnbClone</a>
        </div>

        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="window.location.href='index.html'">Konaklama</button>
            <button class="nav-tab" onclick="window.location.href='experiences.html'">Etkinlikler</button>
        </nav>

        <div class="nav-right">
            <button id="addListingBtn" class="nav-btn nav-btn-outline" style="display:none;" onclick="window.location.href='index.html'">Evini Kiraya Ver</button>

            <button id="loginBtn" class="nav-btn" onclick="window.location.href='login.html'">Giriş Yap</button>
            <button id="registerBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='register.html'">Kayıt Ol</button>

            <div class="nav-menu" id="navMenu" style="display:none;">
                <button class="nav-menu-trigger" id="navMenuTrigger" aria-haspopup="true" aria-expanded="false">
                    <span class="nav-menu-icon">☰</span>
                    <span class="nav-menu-avatar">👤</span>
                </button>
                <div class="nav-menu-dropdown" id="navMenuDropdown">
                    <div class="nav-menu-greeting" id="userNameDisplay"></div>
                    <button class="nav-menu-item" id="myListingsBtn" onclick="window.location.href='my-listings.html'">İlanlarım</button>
                    <button class="nav-menu-item" id="myExperiencesBtn" onclick="window.location.href='my-experiences.html'">Etkinliklerim</button>
                    <button class="nav-menu-item" id="myTripsBtn" onclick="window.location.href='my-trips.html'">Seyahatlerim</button>
                    <button class="nav-menu-item" id="favoritesBtn" onclick="window.location.href='favorites.html'">Favorilerim</button>
                    <button class="nav-menu-item" id="profileBtn" onclick="window.location.href='profile.html'">Profil</button>
                    <button class="nav-menu-item" id="adminPanelBtn" onclick="window.location.href='admin.html'">Admin Paneli</button>
                    <hr class="nav-menu-divider">
                    <button class="nav-menu-item nav-menu-item-danger" id="logoutBtn">Çıkış Yap</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container" id="detailContainer">
        <p class="empty-state">İlan detayları yükleniyor...</p>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/detail.js"></script>
</body>
</html>

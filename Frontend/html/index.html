<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AirbnbClone — Türkiye'nin dört bir yanında eşsiz konaklama deneyimleri keşfedin.">
    <title>AirbnbClone — Ev Kiralama</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Üst Menü -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">🏠 AirbnbClone</a>
        </div>
        <div class="nav-links">
            <span id="userNameDisplay" class="nav-greeting" style="display:none;"></span>
            
            <button id="addListingBtn" class="nav-btn" style="display:none;">Evini Kiraya Ver</button>
            <button id="favoritesBtn" class="nav-btn" onclick="window.location.href='favorites.html'" style="display:none;">Favorilerim</button>
            <button id="myListingsBtn" class="nav-btn" onclick="window.location.href='my-listings.html'" style="display:none;">İlanlarım</button>
            <button id="myTripsBtn" class="nav-btn" onclick="window.location.href='my-trips.html'" style="display:none;">Seyahatlerim</button>
            
            <button id="profileBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='profile.html'" style="display:none; margin-left: 10px;">Profil</button>
            <button id="adminPanelBtn" class="nav-btn nav-btn-admin" onclick="window.location.href='admin.html'" style="display:none;">Admin Paneli</button>
            <button id="logoutBtn" class="nav-btn nav-btn-logout" style="display:none;">Çıkış Yap</button>
            
            <button id="loginBtn" class="nav-btn" onclick="window.location.href='login.html'">Giriş Yap</button>
            <button id="registerBtn" class="nav-btn nav-btn-outline" onclick="window.location.href='register.html'">Kayıt Ol</button>
        </div>
    </header>

    <!-- Ana İçerik -->
    <main class="container">

        <!-- Arama ve Filtreleme -->
        <div class="search-wrapper">
            <div class="search-field">
                <label for="searchCity">ŞEHİR VEYA BÖLGE</label>
                <input type="text" id="searchCity" placeholder="Nereye gitmek istersiniz?">
            </div>
            <div class="search-field">
                <label for="searchPrice">MAKS. FİYAT (₺)</label>
                <input type="number" id="searchPrice" placeholder="Örn: 1500">
            </div>
            <div class="search-field">
                <label for="searchGuests">MİSAFİR</label>
                <input type="number" id="searchGuests" placeholder="Kişi sayısı">
            </div>
            <button class="search-btn" onclick="performSearch()">🔍 Ara</button>
        </div>

        <h2 class="section-title">Popüler Evler</h2>
        <div class="listings-grid" id="listingsGrid">
            <p>Evler yükleniyor...</p>
        </div>
    </main>

    <!-- İlan Ekleme Modalı (Gizli) -->
    <div id="addListingModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Yeni Ev İlanı Ekle</h2>
            <form id="addListingForm">
                <input type="text"   id="title"        class="form-input" placeholder="İlan Başlığı" required>
                <textarea            id="description"  class="form-input" placeholder="Ev Açıklaması" required></textarea>

                <div class="form-row">
                    <input type="text" id="city"    class="form-input" placeholder="Şehir"  required>
                    <input type="text" id="country" class="form-input" placeholder="Ülke"   required>
                </div>

                <textarea id="fullAddress" class="form-input" placeholder="Açık Adres" required></textarea>

                <div class="form-row">
                    <input type="text"   id="propertyType" class="form-input" placeholder="Ev Tipi (Örn: Villa)" required>
                    <input type="number" id="price"        class="form-input" placeholder="Gecelik Fiyat (₺)"   required>
                </div>

                <div class="form-row">
                    <input type="number" id="maxGuests" class="form-input" placeholder="Misafir" required min="1">
                    <input type="number" id="bedrooms"  class="form-input" placeholder="Oda"     required min="1">
                    <input type="number" id="beds"      class="form-input" placeholder="Yatak"   required min="1">
                    <input type="number" id="bathrooms" class="form-input" placeholder="Banyo"   required min="1">
                </div>

                <input type="file" id="imageFile" accept="image/*" multiple style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px;">
                <button type="submit" class="submit-btn">İlanı Kaydet</button>
            </form>
        </div>
    </div>

    <script src="../js/navbar.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
